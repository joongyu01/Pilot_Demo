name: Deploy live demo

# If any tracked branch has moved, rebuild the demo from the new tips, test them in a
# real browser, and publish. A failing build or test leaves the previous good demo
# online. The schedule asks every 15 minutes, but GitHub drops most scheduled runs
# (11-16: about one every 4-8 hours), so pushes to the owner's branch also dispatch
# this workflow (`gh workflow run deploy.yml -R joongyu01/Pilot_Demo`).
#
# Targets, each with its own browser storage (demo/backend-worker.js):
#   /               UPSTREAM_BRANCH
#   /PREVIEW_PATH/  PREVIEW_BRANCH (the cluster page opens this one)
#   /WIP_PATH/      WIP_BRANCH
# A sub-path target whose branch is gone is skipped. Runs on other refs of this
# repository build and test only; publishing is for main.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ajouatom/openpilot
  UPSTREAM_BRANCH: joongyu01/carrot-wip-dev  # main demo pinned to the owner's branch (11-14)
  PREVIEW_REPO: ajouatom/openpilot
  PREVIEW_BRANCH: joongyu01/carrot-wip-dev
  PREVIEW_PATH: dev
  WIP_REPO: ajouatom/openpilot
  WIP_BRANCH: carrot-wip
  WIP_PATH: wip

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.cmp.outputs.build }}
      upstream: ${{ steps.cmp.outputs.upstream }}
      preview: ${{ steps.cmp.outputs.preview }}
      wip: ${{ steps.cmp.outputs.wip }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: state
      - id: cmp
        run: |
          upstream=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          deployed=$(jq -r '.commit // ""' state/upstream.json 2>/dev/null || true)
          preview=$(git ls-remote "https://github.com/${PREVIEW_REPO}.git" "refs/heads/${PREVIEW_BRANCH}" | cut -f1)
          preview_deployed=$(jq -r '.commit // ""' state/preview.json 2>/dev/null || true)
          wip=$(git ls-remote "https://github.com/${WIP_REPO}.git" "refs/heads/${WIP_BRANCH}" | cut -f1)
          wip_deployed=$(jq -r '.commit // ""' state/wip.json 2>/dev/null || true)
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"
          echo "preview=${preview}" >> "$GITHUB_OUTPUT"
          echo "wip=${wip}" >> "$GITHUB_OUTPUT"
          echo "upstream ${upstream:0:8}, deployed ${deployed:0:8}; preview ${preview:0:8}, deployed ${preview_deployed:0:8}; wip ${wip:0:8}, deployed ${wip_deployed:0:8}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$upstream" != "$deployed" ] || [ "$preview" != "$preview_deployed" ] || [ "$wip" != "$wip_deployed" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      upstream: ${{ steps.main.outputs.sha }}
      preview: ${{ steps.preview.outputs.sha }}
      wip: ${{ steps.wip.outputs.sha }}
    env:
      DEMO_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tools and repository checks
        run: |
          pip install --quiet aiohttp numpy pycapnp
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/persist.mjs
          node tests/cluster-bridge.mjs
          python tests/cluster_fields.py

      # Each step: sparse clone of the tip, upstream web build, site assembly,
      # native backend checks, browser checks (tools/build_target.sh).
      - name: Main demo (/)
        id: main
        run: |
          sha=$(bash tools/build_target.sh "$UPSTREAM_REPO" "$UPSTREAM_BRANCH" _site /Pilot_Demo/ /)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Branch preview (/PREVIEW_PATH/)
        id: preview
        if: needs.check.outputs.preview != ''
        run: |
          sha=$(bash tools/build_target.sh "$PREVIEW_REPO" "$PREVIEW_BRANCH" "_site/${PREVIEW_PATH}" "/${PREVIEW_PATH}/")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: carrot-wip (/WIP_PATH/)
        id: wip
        if: needs.check.outputs.wip != ''
        run: |
          sha=$(bash tools/build_target.sh "$WIP_REPO" "$WIP_BRANCH" "_site/${WIP_PATH}" "/${WIP_PATH}/")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  record:
    # Commit the deployed upstream commit. This is the bot's memory for the
    # scheduled check, and the commit keeps the schedule alive (GitHub pauses
    # scheduled workflows in repositories without activity for 60 days).
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tip of main, not the run's commit: an earlier queued run may have recorded since.
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p state
          sha="${{ needs.build.outputs.upstream }}"
          if [ "$sha" != "$(jq -r '.commit // ""' state/upstream.json 2>/dev/null || true)" ]; then
            jq -n --arg commit "$sha" --arg repo "$UPSTREAM_REPO" --arg branch "$UPSTREAM_BRANCH" --arg at "$now" '{repo: $repo, branch: $branch, commit: $commit, deployedAt: $at}' > state/upstream.json
          fi
          preview="${{ needs.build.outputs.preview }}"
          if [ -z "$preview" ]; then
            rm -f state/preview.json
          elif [ "$preview" != "$(jq -r '.commit // ""' state/preview.json 2>/dev/null || true)" ]; then
            jq -n --arg commit "$preview" --arg repo "$PREVIEW_REPO" --arg branch "$PREVIEW_BRANCH" --arg path "$PREVIEW_PATH" --arg at "$now" '{repo: $repo, branch: $branch, path: $path, commit: $commit, deployedAt: $at}' > state/preview.json
          fi
          wip="${{ needs.build.outputs.wip }}"
          if [ -z "$wip" ]; then
            rm -f state/wip.json
          elif [ "$wip" != "$(jq -r '.commit // ""' state/wip.json 2>/dev/null || true)" ]; then
            jq -n --arg commit "$wip" --arg repo "$WIP_REPO" --arg branch "$WIP_BRANCH" --arg path "$WIP_PATH" --arg at "$now" '{repo: $repo, branch: $branch, path: $path, commit: $commit, deployedAt: $at}' > state/wip.json
          fi
          git add -A state
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Track ${UPSTREAM_BRANCH} ${sha:0:8}${preview:+, preview ${preview:0:8}}${wip:+, ${WIP_BRANCH} ${wip:0:8}}"
          git push
