<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Carrot Web Live Demo</title>
  <script>
    // The dedicated demo domain serves the application from the root.
    const base = location.hostname === "demopilot.joongyu.co.kr" ? "/"
      : "/" + (location.pathname.split("/")[1] || "") + "/";
    if (location.pathname !== base) location.replace(base);
  </script>
