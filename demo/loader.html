<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Carrot Web Live Demo</title>
  <meta name="description" content="ajouatom/openpilot carrot-wip의 Carrot Web을 기기 없이 브라우저에서 실행하는 라이브 데모">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      align-items: center;
      background: #0b1016;
      color: #e8edf3;
      display: flex;
      font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      justify-content: center;
      padding: 0 16px;
    }
    main { max-width: 420px; text-align: center; width: 100%; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h1 span { color: #ff9f5a; }
    .sub { color: #8d99a6; font-size: 13px; margin: 0 0 24px; }
    .track { background: #1c2530; border-radius: 99px; height: 6px; overflow: hidden; }
    #demoBootBar { background: #ff9f5a; height: 100%; transition: width .4s ease; width: 4%; }
    #demoBootStep { color: #c3ccd6; font-size: 13px; margin-top: 12px; min-height: 20px; }
    .note { color: #6f7b88; font-size: 12px; margin-top: 28px; }
    .note code { color: #9aa6b2; }
    #demoBootError { background: #2a1416; border: 1px solid #5b2a2e; border-radius: 10px; margin-top: 20px; padding: 12px; text-align: left; }
    #demoBootError pre { color: #f2b8bd; font-size: 11px; margin: 8px 0; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    #demoBootError button { background: #ff9f5a; border: 0; border-radius: 8px; color: #1a1006; font-weight: 700; padding: 8px 14px; }
  </style>
  <script>window.__CARROT_DEMO_META__ = __DEMO_META__;</script>
  <script src="_demo/boot.js?v=__DEMO_VERSION__"></script>
</head>
<body>
  <main role="status" aria-live="polite">
    <h1><span>Carrot</span> Web Live Demo</h1>
    <p class="sub">carrot-wip 최신 코드를 브라우저에서 그대로 실행합니다</p>
    <div class="track"><div id="demoBootBar"></div></div>
    <div id="demoBootStep">준비 중 · Preparing</div>
    <div id="demoBootError" hidden>
      <strong>데모를 시작하지 못했습니다</strong>
      <pre></pre>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
    <p class="note">첫 실행은 Python 런타임(약 6MB)을 내려받아 10초 안팎 걸립니다.<br>두 번째부터는 브라우저 캐시로 빨라집니다.</p>
  </main>
</body>
</html>
